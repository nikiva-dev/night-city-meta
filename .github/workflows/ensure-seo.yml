name: Ensure SEO after publish

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "seo/**"
      - "tools/ensure_seo.py"
      - ".github/workflows/ensure-seo.yml"

concurrency:
  group: ensure-seo-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ensure-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test injector
        run: python tools/ensure_seo.py --self-test

      - name: Apply SEO
        run: python tools/ensure_seo.py

      - name: Commit if SEO was missing
        run: |
          if git diff --quiet -- index.html robots.txt sitemap.xml; then
            echo "SEO already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html robots.txt sitemap.xml
          git commit -m "chore: restore Cyberpunk TCG meta SEO after dashboard publish [seo-ensure]"
          git push
